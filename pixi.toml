[workspace]
authors = ["MertCanYeg <61737235+MertCanYeg@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "stable-audio-lab"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
check-env = "python check_env.py"
generate = "python generate.py"
ui = "python app.py"
test = "python -m unittest discover -s tests -p \"test_*.py\""
update = "git pull"
download-models = "python download_models.py"

[dependencies]
python = "3.12.*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu132"]
index-strategy = "unsafe-best-match"

[pypi-options.dependency-overrides]
torch = "==2.13.0"
torchaudio = ">=2.7.1"

[pypi-dependencies]
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cu132" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu132" }
torchaudio = ">=2.7.1"
matplotlib = ">=3.8.0"
accelerate = ">=0.28.0"
soundfile = ">=0.13.1"
gradio = ">=5.0"
huggingface-hub = ">=0.28.0"
python-dotenv = ">=1.0.0"
stable-audio-3 = { git = "https://github.com/Stability-AI/stable-audio-3.git" }
